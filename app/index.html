<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05080d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PULL">
<meta name="description" content="PULL — your finger is gravity.">
<title>PULL</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="./assets/icon/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="./assets/icon/favicon-64.png">
<link rel="apple-touch-icon" href="./assets/icon/apple-touch-icon-180.png">
<link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" href="./assets/icon/splash-1170x2532.png">
<style>
  :root { --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #05080d;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas {
    display: block; width: 100vw; height: 100vh;
    /* the tube breathes — sub-perceptual */
    animation: ph-breathe 6s ease-in-out infinite;
  }
  /* CRT dressing, DOM-composited so it costs the canvas nothing.
     Scanlines: 1px dark line every 3px (kit: rgba(0,0,0,.32) 0-1px / 3px),
     drifting one pitch on a stepped clock. Opacity + vignette stop are
     driven per-frame by the intensity ramp (22a-22d). */
  #crt {
    position: fixed; inset: -4px; pointer-events: none; z-index: 2;
    background: repeating-linear-gradient(
      0deg,
      rgba(0, 0, 0, 1) 0px,
      rgba(0, 0, 0, 1) 1px,
      transparent 1px,
      transparent 3px
    );
    opacity: 0.32;
    animation: ph-scan 1.4s steps(3, end) infinite;
  }
  #vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background: radial-gradient(110% 100% at 50% 50%, transparent 58%, rgba(0, 0, 0, 0.5));
  }
  #probe { position: absolute; top: var(--sat); left: 0; width: 0; height: 0; visibility: hidden; }
  @keyframes ph-breathe { 0%, 100% { opacity: .97 } 45% { opacity: 1 } 62% { opacity: .94 } }
  @keyframes ph-scan { 0% { transform: translateY(0) } 100% { transform: translateY(3px) } }
  .reduce-motion canvas, .reduce-motion #crt { animation: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="vignette"></div>
<div id="crt"></div>
<div id="probe"></div>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
