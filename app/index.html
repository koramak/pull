<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05080d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PULL">
<meta name="description" content="PULL — your finger is gravity.">
<title>PULL</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="./assets/icon/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="./assets/icon/favicon-64.png">
<link rel="apple-touch-icon" href="./assets/icon/apple-touch-icon-180.png">
<link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" href="./assets/icon/splash-1170x2532.png">
<style>
  :root { --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #05080d;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; width: 100vw; height: 100vh; }
  /* CRT dressing: scanlines + vignette, DOM-composited so it costs the
     canvas nothing. Kept faint — legibility of play objects wins. */
  #crt {
    position: fixed; inset: 0; pointer-events: none; z-index: 2;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0, 0, 0, 0.16) 0px,
      rgba(0, 0, 0, 0.16) 1px,
      transparent 1px,
      transparent 3px
    );
    opacity: 0.35;
  }
  #vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0, 0, 0, 0.38) 100%);
  }
  #probe { position: absolute; top: var(--sat); left: 0; width: 0; height: 0; visibility: hidden; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="vignette"></div>
<div id="crt"></div>
<div id="probe"></div>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
