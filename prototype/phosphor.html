<!doctype html><html><head><title>PULL — Phosphor Prototype</title><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}</style></head><body>
<style>
/* PULL — Phosphor Kit build, self-contained. Single-theme by design: a
   phosphor tube has exactly one appearance. */
html, body {
  margin: 0; padding: 0; height: 100%; overflow: hidden;
  background: #05080d;
  touch-action: none; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
canvas { display: block; width: 100vw; height: 100vh; animation: ph-breathe 6s ease-in-out infinite; }
#crt {
  position: fixed; inset: -4px; pointer-events: none; z-index: 2;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,1) 0px, rgba(0,0,0,1) 1px, transparent 1px, transparent 3px);
  opacity: 0.32;
  animation: ph-scan 1.4s steps(3, end) infinite;
}
#vignette {
  position: fixed; inset: 0; pointer-events: none; z-index: 1;
  background: radial-gradient(110% 100% at 50% 50%, transparent 58%, rgba(0,0,0,0.5));
}
#probe { position: absolute; top: env(safe-area-inset-top, 0px); left: 0; width: 0; height: 0; visibility: hidden; }
@keyframes ph-breathe { 0%, 100% { opacity: .97 } 45% { opacity: 1 } 62% { opacity: .94 } }
@keyframes ph-scan { 0% { transform: translateY(0) } 100% { transform: translateY(3px) } }
.reduce-motion canvas, .reduce-motion #crt { animation: none; }
@media (prefers-reduced-motion: reduce) { canvas, #crt { animation: none; } }
